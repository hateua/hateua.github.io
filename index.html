<div class="module" style="grid-column: span 2;">
    <div class="module-header"><span>Cinema Terminal</span> <span style="color: var(--blue)">Live_Stream</span></div>
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <input type="text" id="movieSearch" placeholder="Введите название фильма или сериала..." style="margin-bottom: 0;">
        <button onclick="searchMovie()" style="width: auto;">Найти</button>
    </div>
    
    <div id="playerContainer" style="display: none; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: #000;">
        <iframe id="videoPlayer" src="" width="100%" height="400" frameborder="0" allowfullscreen></iframe>
    </div>

    <div id="movieInfo" style="margin-top: 10px; font-size: 12px; color: #8b949e;">
        * Внимание: Плеер предоставлен сторонними агрегаторами. Возможна реклама внутри видео.
    </div>
</div>

<script>
    function searchMovie() {
        const query = document.getElementById('movieSearch').value;
        const playerContainer = document.getElementById('playerContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const status = document.getElementById('movieInfo');

        if (!query) {
            alert("Введите название!");
            return;
        }

        // Мы используем один из популярных бесплатных агрегаторов плееров.
        // Особенность: он ищет по названию, если добавить его в URL.
        const playerUrl = `https://vidsrc.to/embed/movie/${encodeURIComponent(query)}`; 
        // Альтернативный вариант (русскоязычный):
        const ruPlayerUrl = `https://www.kinopoisk.gg/search/?q=${encodeURIComponent(query)}`;

        status.innerHTML = `Searching for: <strong>${query}</strong>...`;
        
        // В данном примере используем заглушку поиска (так как прямые API часто требуют ключей)
        // Но для "хакерского" сайта мы сделаем хитрый ход:
        videoPlayer.src = `https://voidboost.net/embed/search/?title=${encodeURIComponent(query)}`;
        
        playerContainer.style.display = 'block';
    }
</script>
