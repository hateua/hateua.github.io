<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-title" content="Курс валют">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&font-size=0.8&rounded=false">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&font-size=0.8&rounded=false">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <title>Pixel Rates Online</title>
    <style>
        /* ----- PIXEL ART STYLES (Monochrome) ----- */
        :root {
            --bg: #000000;
            --main-text: #ffffff; /* Белый цвет для главного */
            --secondary: #aaaaaa; /* Светло-серый для рамок и мелочей */
            --dim: #555555;       /* Темно-серый для теней */
            --border-style: 4px solid var(--secondary);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive; /* Пиксельный шрифт */
            background-color: var(--bg);
            color: var(--main-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* СНЕГ (Теперь белый) */
        .snowflake {
            position: fixed;
            top: -10px;
            color: var(--main-text);
            font-size: 8px; /* Чуть меньше снежинки */
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        /* ЭКРАН ЗАГРУЗКИ */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .loading-text {
            color: var(--main-text);
            font-size: 16px; /* Уменьшен шрифт */
            animation: blink 0.5s infinite;
            margin-bottom: 20px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        header {
            width: 90%;
            max-width: 450px;
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        h2 { 
            margin: 0; 
            font-size: 16px; /* Уменьшен шрифт заголовка */
            text-transform: uppercase;
            color: var(--main-text);
            line-height: 1.5;
        }

        .converter-box { 
            width: 85%; 
            max-width: 450px; 
            z-index: 10;
        }

        /* Поле ввода */
        .input-wrapper {
            background: #000;
            border: var(--border-style);
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 6px 6px 0px var(--dim);
        }

        input {
            background: transparent;
            border: none;
            color: var(--main-text);
            font-family: 'Press Start 2P', cursive;
            font-size: 18px; /* Уменьшен шрифт ввода */
            width: 55%;
            outline: none;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 8px;
            color: var(--secondary);
            position: absolute;
            right: 0;
            top: 6px;
            pointer-events: none;
        }

        select {
            background: transparent;
            border: none;
            color: var(--secondary);
            font-family: 'Press Start 2P', cursive;
            font-size: 12px; /* Уменьшен шрифт выбора */
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            padding-right: 20px;
        }

        /* Результаты */
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 50px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 2px solid var(--secondary);
            background: #111;
            cursor: pointer;
            transition: 0.1s;
        }

        .result-item:active {
            transform: translate(2px, 2px);
            border-color: var(--main-text);
        }

        .currency-left { display: flex; align-items: center; }
        .flag-icon { font-size: 18px; margin-right: 15px; } /* Уменьшен флаг */
        .code { font-size: 12px; color: var(--secondary); } /* Уменьшен код */
        .value { font-size: 12px; color: var(--main-text); } /* Уменьшено значение */

        .hint {
            text-align: center;
            font-size: 8px;
            color: var(--dim);
            margin-bottom: 20px;
            margin-top: -10px;
            text-transform: uppercase;
        }
        
        .update-time {
            font-size: 8px;
            color: var(--dim);
            margin-top: 10px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div id="loader">
        <div class="loading-text">LOADING...</div>
        <div style="font-size: 8px; color: #555;">INITIALIZING SYSTEMS</div>
    </div>

    <div id="snow-container"></div>

    <header>
        <h2 id="app-title">PIXEL RATES</h2>
    </header>

    <div class="converter-box">
        <div class="input-wrapper">
            <input type="number" id="amount" value="100" inputmode="decimal">
            <div class="select-wrapper">
                <select id="baseCurrency">
                    <option value="UAH">UAH</option>
                    <option value="KZT">KZT</option> <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="PLN">PLN</option>
                    <option value="CZK">CZK</option>
                </select>
            </div>
        </div>

        <p class="hint" id="hint-text">TAP TO SWAP</p>

        <div id="results" class="result-list"></div>
        <div id="last-update" class="update-time"></div>
    </div>

    <script>
        // --- 1. ТЕКСТЫ И ПЕРЕВОД ---
        const TEXTS = {
            ru: { title: "КУРСЫ ВАЛЮТ", hint: "НАЖМИ ДЛЯ ВЫБОРА", loading: "ЗАГРУЗКА..." },
            en: { title: "PIXEL RATES", hint: "TAP TO SWAP", loading: "LOADING..." },
            ua: { title: "КУРС ВАЛЮТ", hint: "НАТИСНИ ДЛЯ ВИБОРУ", loading: "ЗАВАНТАЖЕННЯ..." },
            kz: { title: "ВАЛЮТА БАҒАМЫ", hint: "ТАҢДАУ ҮШІН БАСЫҢЫЗ", loading: "ЖҮКТЕУ..." }
        };

        // --- 2. НАСТРОЙКИ ВАЛЮТ (Добавлен KZT) ---
        const TARGETS = [
            { code: 'USD', flag: '🇺🇸' },
            { code: 'EUR', flag: '🇪🇺' },
            { code: 'KZT', flag: '🇰🇿' }, // Казахстан
            { code: 'PLN', flag: '🇵🇱' },
            { code: 'CZK', flag: '🇨🇿' },
            { code: 'UAH', flag: '🇺🇦' }
        ];
        
        // --- 3. СНЕГ ---
        function createSnow() {
            const container = document.getElementById('snow-container');
            const w = window.innerWidth;
            
            setInterval(() => {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.innerText = '■'; 
                flake.style.left = Math.random() * w + 'px';
                flake.style.opacity = Math.random() * 0.7; // Чуть прозрачнее
                flake.style.fontSize = (Math.random() * 4 + 4) + 'px'; // Меньше размер (4-8px)
                
                const duration = Math.random() * 5 + 5;
                flake.style.animationDuration = duration + 's';
                
                container.appendChild(flake);
                setTimeout(() => flake.remove(), duration * 1000);
            }, 350);
        }

        // --- 4. ЛОГИКА ---
        const amountInput = document.getElementById('amount');
        const baseSelect = document.getElementById('baseCurrency');
        const resultsContainer = document.getElementById('results');
        const loader = document.getElementById('loader');
        const loaderText = document.querySelector('.loading-text');

        let ratesData = {}; 

        // Авто-определение языка и страны (Добавлен KZ)
        function autoDetect() {
            const lang = (navigator.language || navigator.userLanguage).toLowerCase();
            let currentLang = 'en';
            
            if (lang.includes('kz') || lang.includes('kk')) {
                currentLang = 'kz';
                baseSelect.value = 'KZT';
            } else if (lang.includes('ru')) {
                currentLang = 'ru';
                // Если русский язык, но не КЗ, по умолчанию UAH (или можно USD)
                if (baseSelect.value !== 'KZT') baseSelect.value = 'UAH';
            } else if (lang.includes('ua') || lang.includes('uk')) {
                currentLang = 'ua';
                baseSelect.value = 'UAH';
            } else if (lang.includes('pl')) {
                baseSelect.value = 'PLN';
            } else {
                baseSelect.value = 'USD';
            }

            document.getElementById('app-title').innerText = TEXTS[currentLang].title;
            document.getElementById('hint-text').innerText = TEXTS[currentLang].hint;
            loaderText.innerText = TEXTS[currentLang].loading;
        }

        // Кэширование (24 часа)
        async function fetchRates() {
            const CACHE_KEY = 'pixel_rates_cache_v2'; // v2 чтобы сбросить старый кэш
            const ONE_DAY = 24 * 60 * 60 * 1000;
            
            const cached = localStorage.getItem(CACHE_KEY);
            let useCache = false;

            if (cached) {
                const parsed = JSON.parse(cached);
                if (Date.now() - parsed.timestamp < ONE_DAY) {
                    console.log('Using Cache');
                    ratesData = parsed.rates;
                    document.getElementById('last-update').innerText = 'DATA: CACHED (24H)';
                    useCache = true;
                    setTimeout(() => {
                        loader.style.display = 'none';
                        calculate();
                    }, 1000); 
                }
            }

            if (!useCache) {
                try {
                    console.log('Fetching New Data');
                    const response = await fetch('https://open.er-api.com/v6/latest/USD');
                    const data = await response.json();
                    if (!data || !data.rates) throw new Error('API Error');
                    ratesData = data.rates;
                    
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        timestamp: Date.now(),
                        rates: ratesData
                    }));

                    document.getElementById('last-update').innerText = 'DATA: UPDATED NOW';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        calculate();
                    }, 2000);

                } catch (error) {
                    console.error(error);
                    loaderText.innerText = "NET ERROR X_X";
                }
            }
        }

        function calculate() {
            const amount = parseFloat(amountInput.value);
            const base = baseSelect.value;
            resultsContainer.innerHTML = '';
            if (isNaN(amount) || !ratesData[base]) return;

            const baseRate = ratesData[base]; 

            TARGETS.forEach(currency => {
                if (currency.code === base) return;

                const targetRate = ratesData[currency.code];
                const result = (amount / baseRate) * targetRate;

                // Форматирование для тенге (без копеек, если число большое)
                let fraction = 2;
                if (currency.code === 'KZT' && result > 100) fraction = 0;

                let formatted = result.toLocaleString('ru-RU', {
                    minimumFractionDigits: fraction,
                    maximumFractionDigits: fraction
                });

                const div = document.createElement('div');
                div.className = 'result-item';
                div.onclick = function() { 
                    baseSelect.value = currency.code;
                    calculate();
                };
                
                div.innerHTML = `
                    <div class="currency-left">
                        <span class="flag-icon">${currency.flag}</span>
                        <span class="code">${currency.code}</span>
                    </div>
                    <span class="value">${formatted}</span>
                `;
                resultsContainer.appendChild(div);
            });
        }

        createSnow();
        autoDetect();
        fetchRates();

        amountInput.addEventListener('input', calculate);
        baseSelect.addEventListener('change', calculate);
        document.querySelector('.input-wrapper').addEventListener('click', () => amountInput.focus());

    </script>
</body>
</html>
