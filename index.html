<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-title" content="Курс валют">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&font-size=0.8&rounded=false">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&font-size=0.8&rounded=false">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <title>Курс валют</title>
    <style>
        :root {
            --bg: #000000;
            --main-text: #ffffff;
            --secondary: #aaaaaa;
            --dim: #555555;
            --border-style: 4px solid var(--secondary);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', monospace; /* Monospace fallback */
            background-color: var(--bg); color: var(--main-text);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* СНЕГ */
        .snowflake {
            position: fixed; top: -10px; color: var(--main-text);
            font-size: 8px; pointer-events: none; z-index: 0;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh); } }

        /* HEADER */
        header {
            width: 90%; max-width: 450px; margin-top: 20px;
            margin-bottom: 30px; text-align: center; z-index: 10;
        }
        h2 { margin: 0; font-size: 16px; text-transform: uppercase; line-height: 1.5; }

        .converter-box { width: 85%; max-width: 450px; z-index: 10; }

        /* INPUT */
        .input-wrapper {
            background: #000; border: var(--border-style);
            padding: 15px; margin-bottom: 30px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 6px 6px 0px var(--dim);
        }
        input {
            background: transparent; border: none; color: var(--main-text);
            font-family: 'Press Start 2P', monospace; font-size: 18px;
            width: 55%; outline: none;
        }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▼'; font-size: 8px; color: var(--secondary);
            position: absolute; right: 0; top: 6px; pointer-events: none;
        }
        select {
            background: transparent; border: none; color: var(--secondary);
            font-family: 'Press Start 2P', monospace; font-size: 12px;
            outline: none; appearance: none; -webkit-appearance: none; padding-right: 20px;
        }

        /* LIST */
        .result-list { display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }

        .result-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border: 2px solid var(--secondary); background: #111;
            cursor: pointer; transition: 0.1s;
        }
        .result-item:active { transform: translate(2px, 2px); border-color: var(--main-text); }

        .currency-left { display: flex; align-items: center; }
        .flag-icon { font-size: 18px; margin-right: 15px; }
        .code { font-size: 12px; color: var(--secondary); }
        .value { font-size: 12px; color: var(--main-text); }

        .hint {
            text-align: center; font-size: 8px; color: var(--dim);
            margin-bottom: 20px; margin-top: -10px; text-transform: uppercase;
        }
        
        .debug-info {
            font-size: 8px; color: #333; text-align: center; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="snow-container"></div>

    <header>
        <h2 id="app-title">PIXEL RATES</h2>
    </header>

    <div class="converter-box">
        <div class="input-wrapper">
            <input type="number" id="amount" value="100" inputmode="decimal">
            <div class="select-wrapper">
                <select id="baseCurrency">
                    <option value="UAH">UAH</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="PLN">PLN</option>
                    <option value="CZK">CZK</option>
                    <option value="KZT">KZT</option>
                </select>
            </div>
        </div>

        <p class="hint" id="hint-text">TAP TO SWAP</p>
        
        <div id="results" class="result-list">
            </div>
        
        <div id="debug-status" class="debug-info">INIT...</div>
    </div>

    <script>
        // 1. ЗАПАСНЫЕ КУРСЫ (ЧТОБЫ НЕ БЫЛО ПУСТО)
        // Эти цифры покажутся сразу, если интернет тупит
        const DEFAULT_RATES = {
            "USD": 1,
            "EUR": 0.96,
            "UAH": 41.8,
            "PLN": 3.98,
            "CZK": 23.9,
            "KZT": 505.0
        };

        const TEXTS = {
            ru: { title: "КУРСЫ ВАЛЮТ", hint: "НАЖМИ ДЛЯ ВЫБОРА" },
            en: { title: "PIXEL RATES", hint: "TAP TO SWAP" },
            ua: { title: "КУРС ВАЛЮТ", hint: "НАТИСНИ ДЛЯ ВИБОРУ" },
            kz: { title: "ВАЛЮТА БАҒАМЫ", hint: "ТАҢДАУ ҮШІН БАСЫҢЫЗ" }
        };

        const TARGETS = [
            { code: 'USD', flag: '🇺🇸' },
            { code: 'EUR', flag: '🇪🇺' },
            { code: 'KZT', flag: '🇰🇿' },
            { code: 'PLN', flag: '🇵🇱' },
            { code: 'CZK', flag: '🇨🇿' },
            { code: 'UAH', flag: '🇺🇦' }
        ];

        // Элементы
        const amountInput = document.getElementById('amount');
        const baseSelect = document.getElementById('baseCurrency');
        const resultsContainer = document.getElementById('results');
        const debugStatus = document.getElementById('debug-status');

        // Сразу загружаем дефолтные данные
        let ratesData = DEFAULT_RATES;
        debugStatus.innerText = "MODE: OFFLINE (DEFAULT)";

        // Снег
        function createSnow() {
            const container = document.getElementById('snow-container');
            setInterval(() => {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.innerText = '■'; 
                flake.style.left = Math.random() * window.innerWidth + 'px';
                flake.style.opacity = Math.random() * 0.5; 
                flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(flake);
                setTimeout(() => flake.remove(), 10000);
            }, 400);
        }

        // Авто-язык
        function autoDetect() {
            try {
                const lang = (navigator.language || navigator.userLanguage).toLowerCase();
                let currentLang = 'en';
                
                if (lang.includes('kz')) { currentLang = 'kz'; baseSelect.value = 'KZT'; }
                else if (lang.includes('ru')) { currentLang = 'ru'; if(baseSelect.value !== 'KZT') baseSelect.value = 'UAH'; }
                else if (lang.includes('ua') || lang.includes('uk')) { currentLang = 'ua'; baseSelect.value = 'UAH'; }
                else if (lang.includes('pl')) { baseSelect.value = 'PLN'; }
                else { baseSelect.value = 'USD'; }

                document.getElementById('app-title').innerText = TEXTS[currentLang].title;
                document.getElementById('hint-text').innerText = TEXTS[currentLang].hint;
            } catch(e) {}
        }

        // Логика пересчета
        function calculate() {
            const amount = parseFloat(amountInput.value);
            const base = baseSelect.value;
            resultsContainer.innerHTML = '';
            
            if (!ratesData[base]) {
                debugStatus.innerText = "ERROR: NO DATA FOR " + base;
                return;
            }

            const baseRate = ratesData[base]; 

            TARGETS.forEach(currency => {
                if (currency.code === base) return;

                // Если вдруг для какой-то валюты нет курса, берем из дефолта
                const targetRate = ratesData[currency.code] || DEFAULT_RATES[currency.code];
                const result = (amount / baseRate) * targetRate;

                let fraction = 2;
                if (currency.code === 'KZT' && result > 100) fraction = 0;

                let formatted = result.toLocaleString('ru-RU', {
                    minimumFractionDigits: fraction,
                    maximumFractionDigits: fraction
                });

                const div = document.createElement('div');
                div.className = 'result-item';
                div.onclick = function() { 
                    baseSelect.value = currency.code;
                    calculate();
                };
                
                div.innerHTML = `
                    <div class="currency-left">
                        <span class="flag-icon">${currency.flag}</span>
                        <span class="code">${currency.code}</span>
                    </div>
                    <span class="value">${formatted}</span>
                `;
                resultsContainer.appendChild(div);
            });
        }

        // Загрузка из сети
        async function fetchLiveRates() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                
                if (data && data.rates) {
                    ratesData = data.rates;
                    debugStatus.innerText = "MODE: ONLINE (LIVE)";
                    debugStatus.style.color = "#00ff00"; // Зеленый текст если ок
                    calculate(); // Перерисовываем с новыми данными
                }
            } catch (error) {
                console.error("Net Error");
                // Ничего страшного, у нас уже есть дефолтные данные
            }
        }

        // ЗАПУСК
        createSnow();
        autoDetect();
        calculate(); // Рисуем сразу дефолт!
        fetchLiveRates(); // Пытаемся обновить

        amountInput.addEventListener('input', calculate);
        baseSelect.addEventListener('change', calculate);
        document.querySelector('.input-wrapper').addEventListener('click', () => amountInput.focus());

    </script>
</body>
</html>
