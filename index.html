<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMovie / Global Terminal</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #c9d1d9; --accent: #238636; --blue: #58a6ff; --yellow: #f1e05a;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; overflow-x: hidden;
        }

        /* Дизайн в стиле GitHub */
        header {
            background: var(--card); border-bottom: 1px solid var(--border);
            padding: 12px 5%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        .search-bar { flex-grow: 0.5; position: relative; }
        input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            padding: 8px 12px; color: white; border-radius: 6px; outline: none;
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(88,166,255,0.1); }

        .container { padding: 20px 5%; }
        
        /* Сетка фильмов */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px; margin-top: 20px;
        }

        .movie-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; transition: 0.2s;
            cursor: pointer; position: relative; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .movie-card:hover { border-color: #8b949e; transform: translateY(-5px); }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; border-bottom: 1px solid var(--border); }
        
        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; height: 40px; overflow: hidden; }
        .movie-meta { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; }
        .rating { color: var(--yellow); font-weight: bold; }

        /* Плеер и Модалка */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 2000; overflow-y: auto;
        }
        .modal-content {
            max-width: 1000px; margin: 40px auto; background: var(--card);
            border: 1px solid var(--border); border-radius: 12px; padding: 25px;
        }
        .player-container { background: #000; border-radius: 8px; aspect-ratio: 16/9; margin: 20px 0; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Жанры */
        .genres { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .genre-btn {
            background: var(--card); border: 1px solid var(--border); color: var(--text);
            padding: 4px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; white-space: nowrap;
        }
        .genre-btn.active { background: var(--blue); color: #000; border-color: var(--blue); }

        .loader { text-align: center; padding: 50px; font-family: monospace; color: var(--blue); }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 700; font-size: 18px; letter-spacing: -0.5px;">GitCinema <span style="font-weight: 300; color: var(--border);">v2.0</span></div>
    <div class="search-bar">
        <input type="text" id="search" placeholder="Поиск по названию..." onkeypress="handleSearch(event)">
    </div>
    <div style="font-size: 12px; color: var(--accent);">● AUTO_FETCH_ENABLED</div>
</header>

<div class="container">
    <div class="genres" id="genreList">
        <button class="genre-btn active" onclick="loadMovies('all')">All Releases</button>
        <button class="genre-btn" onclick="loadMovies('sci-fi')">Sci-Fi</button>
        <button class="genre-btn" onclick="loadMovies('action')">Action</button>
        <button class="genre-btn" onclick="loadMovies('adventure')">Adventure</button>
        <button class="genre-btn" onclick="loadMovies('horror')">Horror</button>
        <button class="genre-btn" onclick="loadMovies('comedy')">Comedy</button>
    </div>

    <h2 id="listTitle" style="font-weight: 400; font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Trending Now</h2>
    
    <div id="loader" class="loader" style="display:none;">[ LOADING_DATA_FROM_GRID... ]</div>
    <div class="grid" id="movieGrid"></div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size: 24px;" onclick="closeModal()">×</span>
        <div id="movieDetails" style="display: flex; gap: 20px; flex-wrap: wrap;"></div>
        <div class="player-container">
            <iframe id="mainPlayer" src="" allowfullscreen></iframe>
        </div>
        <div id="reviews" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
            <h4 style="margin-top: 0;">Community Reviews</h4>
            <div style="color: #8b949e; font-size: 13px; background: #010409; padding: 15px; border-radius: 6px;">
                // Нет комментариев к этому объекту. Будьте первым, кто сделает pull request с отзывом.
            </div>
        </div>
    </div>
</div>

<script>
    const grid = document.getElementById('movieGrid');
    const loader = document.getElementById('loader');

    // Функция загрузки данных (БЕЗ API КЛЮЧА)
    async function loadMovies(genre = 'all', query = '') {
        grid.innerHTML = '';
        loader.style.display = 'block';
        
        let url = `https://yts.mx/api/v2/list_movies.json?limit=24&sort_by=year`;
        if (genre !== 'all') url += `&genre=${genre}`;
        if (query !== '') url += `&query_term=${encodeURIComponent(query)}`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.data.movie_count === 0) {
                grid.innerHTML = '<p>Ничего не найдено по вашему запросу.</p>';
            } else {
                displayMovies(data.data.movies);
            }
        } catch (e) {
            grid.innerHTML = '<p>Ошибка подключения к базе данных.</p>';
        } finally {
            loader.style.display = 'none';
        }
    }

    function displayMovies(movies) {
        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openMovie(movie);
            card.innerHTML = `
                <img src="${movie.large_cover_image}" alt="${movie.title}">
                <div class="movie-info">
                    <div class="movie-title">${movie.title}</div>
                    <div class="movie-meta">
                        <span>${movie.year}</span>
                        <span class="rating">★ ${movie.rating}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openMovie(movie) {
        const modal = document.getElementById('modal');
        const details = document.getElementById('movieDetails');
        
        details.innerHTML = `
            <img src="${movie.medium_cover_image}" style="width:150px; border-radius:6px; border: 1px solid var(--border);">
            <div style="flex: 1; min-width: 300px;">
                <h1 style="margin:0">${movie.title}</h1>
                <div style="margin: 10px 0; display:flex; gap:10px;">
                    <span style="color: var(--blue)">${movie.year}</span>
                    <span style="color: var(--yellow)">IMDb: ${movie.rating}</span>
                </div>
                <p style="font-size: 14px; color: #8b949e; line-height: 1.6;">${movie.description_full || 'Описание отсутствует.'}</p>
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                    ${movie.genres.map(g => `<span style="background: #21262d; padding: 2px 8px; border-radius: 10px; font-size:11px;">${g}</span>`).join('')}
                </div>
            </div>
        `;

        // Используем код IMDb для подключения плеера
        document.getElementById('mainPlayer').src = `https://vidsrc.to/embed/movie/${movie.imdb_code}`;
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('mainPlayer').src = '';
        document.body.style.overflow = 'auto';
    }

    function handleSearch(e) {
        if (e.key === 'Enter') {
            loadMovies('all', e.target.value);
            document.getElementById('listTitle').innerText = 'Search Results';
        }
    }

    // Инициализация
    loadMovies();

    // Переключение кнопок жанров
    document.querySelectorAll('.genre-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('listTitle').innerText = this.innerText;
        });
    });
</script>
</body>
</html>
