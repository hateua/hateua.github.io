<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-title" content="🤑">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/500/000000/us-dollar-circled--v1.png">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&length=1&size=512&font-size=0.6&rounded=false">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&length=1&size=512&font-size=0.6&rounded=false">

    <title>🤑</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background-color: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Учитываем "чёлку" и безопасные зоны iPhone */
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
        }

        /* Заголовок */
        header {
            width: 90%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        h2 { 
            margin: 0; 
            font-weight: 800; 
            font-size: 28px; 
            letter-spacing: -0.5px;
        }

        /* Индикатор работы */
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #333;
            border-radius: 50%;
            display: inline-block;
            transition: 0.5s;
        }

        .converter-box { width: 90%; max-width: 400px; }

        /* Поле ввода */
        .input-wrapper {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* Легкая тень для объема */
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 36px;
            width: 60%;
            padding: 5px;
            outline: none;
            font-weight: 400;
        }

        .select-wrapper {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
        }

        select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            text-align: right;
        }

        /* Результаты */
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 30px; /* Отступ снизу для скролла */
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5px;
            border-bottom: 1px solid #1a1a1a;
        }

        .flag-icon { font-size: 32px; margin-right: 15px; }
        
        .currency-meta {
            display: flex;
            flex-direction: column;
        }
        
        .code { font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
        .name { font-size: 13px; color: #555; margin-top: 2px; }

        .value {
            font-size: 24px;
            font-weight: 500;
            color: #f2f2f7;
            font-feature-settings: "tnum";
        }
    </style>
</head>
<body>

    <header>
        <h2>Обмен Валют</h2>
        <div id="status" class="status-dot"></div>
    </header>

    <div class="converter-box">
        <div class="input-wrapper">
            <input type="number" id="amount" value="100" inputmode="decimal" placeholder="0">
            <div class="select-wrapper">
                <select id="baseCurrency">
                    <option value="UAH">UAH 🇺🇦</option>
                    <option value="USD">USD 🇺🇸</option>
                    <option value="EUR">EUR 🇪🇺</option>
                    <option value="PLN">PLN 🇵🇱</option>
                    <option value="CZK">CZK 🇨🇿</option>
                </select>
            </div>
        </div>

        <div id="results" class="result-list"></div>
    </div>

    <script>
        // СПИСОК ВАЛЮТ
        const TARGETS = [
            { code: 'USD', name: 'Dollar', flag: '🇺🇸' },
            { code: 'EUR', name: 'Euro', flag: '🇪🇺' },
            { code: 'PLN', name: 'Zloty', flag: '🇵🇱' },
            { code: 'CZK', name: 'Koruna', flag: '🇨🇿' },
            { code: 'UAH', name: 'Hryvnia', flag: '🇺🇦' }
        ];

        const amountInput = document.getElementById('amount');
        const baseSelect = document.getElementById('baseCurrency');
        const resultsContainer = document.getElementById('results');
        const statusDot = document.getElementById('status');
        
        let ratesData = {}; 

        // Загрузка курсов (Обновлено: Open Exchange Rates - надежный источник)
        async function fetchRates() {
            try {
                // Ставим желтый цвет пока грузим
                statusDot.style.backgroundColor = '#ffcc00';

                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                
                if (!data || !data.rates) throw new Error('API Error');

                ratesData = data.rates;
                
                // Зеленый цвет - успех
                statusDot.style.backgroundColor = '#30d158';
                statusDot.style.boxShadow = '0 0 15px #30d158'; // Неоновое свечение
                
                calculate();
            } catch (error) {
                console.error(error);
                // Красный цвет - ошибка
                statusDot.style.backgroundColor = '#ff453a';
            }
        }

        function calculate() {
            const amount = parseFloat(amountInput.value);
            const base = baseSelect.value;
            
            resultsContainer.innerHTML = '';
            
            if (isNaN(amount) || !ratesData[base]) return;

            const baseRate = ratesData[base]; 

            TARGETS.forEach(currency => {
                if (currency.code === base) return;

                const targetRate = ratesData[currency.code];
                const result = (amount / baseRate) * targetRate;

                // Форматирование: 12 500.00
                let formatted = result.toLocaleString('ru-RU', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="flag-icon">${currency.flag}</span>
                        <div class="currency-meta">
                            <span class="code">${currency.code}</span>
                            <span class="name">${currency.name}</span>
                        </div>
                    </div>
                    <span class="value">${formatted}</span>
                `;
                resultsContainer.appendChild(div);
            });
        }

        // Слушатели событий
        amountInput.addEventListener('input', calculate);
        baseSelect.addEventListener('change', calculate);
        
        // Фокус на поле ввода при клике на блок
        document.querySelector('.input-wrapper').addEventListener('click', () => {
            amountInput.focus();
        });

        // Запуск
        fetchRates();
    </script>

</body>
</html>
