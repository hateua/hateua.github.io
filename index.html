<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMovie OS | Terminal v3.0</title>
    <style>
        :root {
            --bg: #0d1117; --side: #010409; --card: #161b22; --border: #30363d;
            --text: #c9d1d9; --muted: #8b949e; --accent: #238636; --blue: #58a6ff; --yellow: #f1e05a;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 260px; background: var(--side); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .side-header { padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border); font-size: 18px; }
        .side-nav { padding: 10px; overflow-y: auto; flex-grow: 1; }
        .nav-item { 
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; 
            margin-bottom: 2px; color: var(--muted); transition: 0.2s;
        }
        .nav-item:hover { background: var(--card); color: var(--text); }
        .nav-item.active { background: var(--card); color: var(--blue); font-weight: 600; border-left: 3px solid var(--blue); }

        /* Main Content */
        main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        header {
            padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .search-container { position: relative; width: 50%; }
        input#search {
            width: 100%; background: var(--side); border: 1px solid var(--border);
            padding: 8px 12px; color: white; border-radius: 6px; outline: none;
        }

        .lang-switch { display: flex; gap: 5px; }
        .lang-btn { 
            background: var(--card); border: 1px solid var(--border); color: var(--muted);
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .lang-btn.active { color: var(--blue); border-color: var(--blue); }

        /* Content Area */
        .content { padding: 20px; overflow-y: auto; }
        .movie-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* Movie Card */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 6px; overflow: hidden; transition: 0.2s; cursor: pointer;
        }
        .card:hover { border-color: var(--muted); transform: translateY(-3px); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-body { padding: 10px; }
        .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }

        /* Modal Player */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 2000; padding: 40px; box-sizing: border-box;
        }
        .modal-inner {
            max-width: 1100px; margin: 0 auto; background: var(--bg);
            border: 1px solid var(--border); border-radius: 12px; height: 90vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-body { display: flex; padding: 20px; gap: 20px; overflow-y: auto; }
        .modal-left { width: 300px; flex-shrink: 0; }
        .modal-right { flex-grow: 1; }
        
        .player-box { background: #000; width: 100%; aspect-ratio: 16/9; margin-top: 20px; border-radius: 8px; }
        iframe { width: 100%; height: 100%; border: none; }

        .stat-badge {
            display: inline-block; padding: 4px 10px; border-radius: 4px;
            background: var(--card); border: 1px solid var(--border);
            font-size: 12px; margin-right: 8px; margin-bottom: 8px;
        }

        /* Loader */
        .loader { text-align: center; color: var(--blue); font-family: monospace; padding: 40px; }
    </style>
</head>
<body>

<aside>
    <div class="side-header">GitMovie_v3</div>
    <div class="side-nav" id="genreNav">
        <div style="font-size: 12px; color: var(--muted); padding: 10px;">BROWSE BY GENRE</div>
        <div class="nav-item active" onclick="loadMovies('all', this)">All Releases</div>
        <div class="nav-item" onclick="loadMovies('action', this)">Action</div>
        <div class="nav-item" onclick="loadMovies('sci-fi', this)">Sci-Fi</div>
        <div class="nav-item" onclick="loadMovies('drama', this)">Drama</div>
        <div class="nav-item" onclick="loadMovies('horror', this)">Horror</div>
        <div class="nav-item" onclick="loadMovies('thriller', this)">Thriller</div>
        <div class="nav-item" onclick="loadMovies('comedy', this)">Comedy</div>
        <div class="nav-item" onclick="loadMovies('animation', this)">Animation</div>
        <div style="font-size: 12px; color: var(--muted); padding: 10px; margin-top: 10px;">NETWORK</div>
        <div class="nav-item" onclick="alert('Switching to TV Series Node...')">TV Series</div>
    </div>
</aside>

<main>
    <header>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search data..." onkeypress="handleSearch(event)">
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('en')">EN</button>
            <button class="lang-btn" onclick="setLang('ru')">RU</button>
        </div>
    </header>

    <div class="content">
        <div id="loader" class="loader" style="display:none;">> INITIALIZING_DATA_STREAM...</div>
        <div class="movie-grid" id="movieGrid"></div>
    </div>
</main>

<div id="modal" class="modal">
    <div class="modal-inner">
        <header style="border-radius: 12px 12px 0 0;">
            <div id="mTitle" style="font-weight: bold;"></div>
            <button onclick="closeModal()" style="background:none; border:none; color:white; cursor:pointer; font-size:20px;">×</button>
        </header>
        <div class="modal-body">
            <div class="modal-left">
                <img id="mPoster" src="" style="width:100%; border-radius:8px; border:1px solid var(--border);">
                <div id="mStats" style="margin-top: 15px;"></div>
            </div>
            <div class="modal-right">
                <div style="font-size: 12px; color: var(--muted); margin-bottom: 10px;" id="mYear"></div>
                <p id="mDesc" style="font-size: 14px; line-height: 1.6; color: var(--muted);"></p>
                
                <div class="player-box">
                    <iframe id="mainPlayer" src="" allowfullscreen></iframe>
                </div>
                
                <div style="margin-top: 20px;">
                    <h4 id="labelComments">System Log / Reviews</h4>
                    <div style="background: var(--side); padding: 15px; border-radius: 6px; font-size: 13px; color: var(--muted); border: 1px dashed var(--border);">
                        [AUTH_REQUIRED] Please sign in with GitHub to pull/push comments.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Переводы
    const i18n = {
        en: {
            search: "Search database...",
            loading: "> INITIALIZING_DATA_STREAM...",
            comments: "System Log / Reviews",
            noDesc: "No description available in the database."
        },
        ru: {
            search: "Поиск в базе данных...",
            loading: "> ИНИЦИАЛИЗАЦИЯ ПОТОКА ДАННЫХ...",
            comments: "Системный лог / Отзывы",
            noDesc: "Описание отсутствует в базе данных."
        }
    };

    let currentLang = 'en';

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase() === lang));
        document.getElementById('search').placeholder = i18n[lang].search;
        document.getElementById('labelComments').innerText = i18n[lang].comments;
    }

    async function loadMovies(genre = 'all', el = null, query = '') {
        const grid = document.getElementById('movieGrid');
        const loader = document.getElementById('loader');
        
        if(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        grid.innerHTML = '';
        loader.style.display = 'block';
        
        let url = `https://yts.mx/api/v2/list_movies.json?limit=30&sort_by=seeds`;
        if (genre !== 'all') url += `&genre=${genre}`;
        if (query) url += `&query_term=${encodeURIComponent(query)}`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            if (data.data.movies) display(data.data.movies);
        } catch (e) {
            grid.innerHTML = '<div style="color:red">ERROR: Connection timed out.</div>';
        } finally {
            loader.style.display = 'none';
        }
    }

    function display(movies) {
        const grid = document.getElementById('movieGrid');
        movies.forEach(m => {
            grid.innerHTML += `
                <div class="card" onclick="openMovie(${m.id})">
                    <img src="${m.medium_cover_image}">
                    <div class="card-body">
                        <div class="card-title">${m.title}</div>
                        <div class="card-meta">
                            <span>${m.year}</span>
                            <span style="color:var(--yellow)">★ ${m.rating}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        // Сохраним данные в глобальную переменную для быстрого доступа
        window.currentMovies = movies;
    }

    function openMovie(id) {
        const m = window.currentMovies.find(x => x.id === id);
        const modal = document.getElementById('modal');
        
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mPoster').src = m.large_cover_image;
        document.getElementById('mYear').innerText = `Released: ${m.year} | Duration: ${m.runtime} min | Language: ${m.language}`;
        document.getElementById('mDesc').innerText = m.description_full || i18n[currentLang].noDesc;
        
        // Статистика
        document.getElementById('mStats').innerHTML = `
            <div class="stat-badge">IMDb: ${m.rating}</div>
            <div class="stat-badge">Likes: ${m.like_count}</div>
            <div class="stat-badge">Quality: ${m.torrents[0].quality}</div>
            <div class="stat-badge">Size: ${m.torrents[0].size}</div>
        `;

        // Плеер (Vidsrc через IMDb ID)
        document.getElementById('mainPlayer').src = `https://vidsrc.to/embed/movie/${m.imdb_code}`;
        
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('mainPlayer').src = '';
        document.body.style.overflow = 'auto';
    }

    function handleSearch(e) {
        if (e.key === 'Enter') {
            loadMovies('all', null, e.target.value);
        }
    }

    // Start
    loadMovies();
</script>
</body>
</html>
