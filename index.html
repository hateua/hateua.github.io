<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS OSINT | Neural Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-canvas: #010409;
            --bg-card: #161b22;
            --border: #30363d;
            --accent: #2f81f7;
            --text: #e6edf3;
            --text-muted: #7d8590;
            --success: #3fb950;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background: var(--bg-canvas);
            border-right: 1px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-weight: 700;
            color: var(--accent);
            font-size: 20px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .nav-item:hover, .nav-item.active {
            background: #21262d;
            color: var(--text);
        }

        /* Main */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .header { margin-bottom: 30px; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }

        /* Search Engine UI */
        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            background: var(--bg-canvas);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }

        button.search-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 30px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Social Mapper Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .social-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .social-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        .social-name { font-weight: 600; font-size: 14px; }
        .btn-go {
            font-size: 11px;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .btn-go:hover { background: var(--accent); color: white; }

        /* Status Badge */
        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(63, 185, 80, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        /* Console */
        .console {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #8b949e;
            height: 150px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }
    </style>
</head>
<body>

    <aside>
        <div class="logo">
            <svg height="24" viewBox="0 0 16 16" width="24" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
            NEXUS OSINT
        </div>
        <div class="nav-item active">Social Identity Mapper</div>
        <div class="nav-item">Network Analysis</div>
        <div class="nav-item">Domain Intel</div>
        <div class="nav-item">Crypto Tracking</div>
        <div style="margin-top: auto; color: #333; font-size: 11px;">Powered by OpenSource Intelligence</div>
    </aside>

    <main>
        <div class="container">
            <div class="header">
                <h1>Social Identity Mapper</h1>
                <p style="color: var(--text-muted)">Имитация Sherlock/Maigret: проверка присутствия никнейма в глобальных сетях.</p>
            </div>

            <div class="search-box">
                <div class="input-group">
                    <input type="text" id="nickInput" placeholder="Введите никнейм (например, elonmusk)..." spellcheck="false">
                    <button class="search-btn" onclick="startSocialScan()">RUN SCAN</button>
                </div>
            </div>

            <div id="console" class="console">
                [SYSTEM] Ready for deployment...
            </div>

            <div id="results" class="results-grid">
                </div>
        </div>
    </main>

    <script>
        const services = [
            { name: "Instagram", url: "https://www.instagram.com/{}" },
            { name: "GitHub", url: "https://github.com/{}" },
            { name: "Twitter / X", url: "https://twitter.com/{}" },
            { name: "Reddit", url: "https://www.reddit.com/user/{}" },
            { name: "TikTok", url: "https://www.tiktok.com/@{}" },
            { name: "Telegram", url: "https://t.me/{}" },
            { name: "Pinterest", url: "https://www.pinterest.com/{}/" },
            { name: "Steam", url: "https://steamcommunity.com/id/{}" },
            { name: "Twitch", url: "https://www.twitch.tv/{}" },
            { name: "Discord (Search)", url: "https://discord.com/search?q={}" },
            { name: "Spotify", url: "https://open.spotify.com/user/{}" },
            { name: "Behance", url: "https://www.behance.net/{}" },
            { name: "Dribbble", url: "https://dribbble.com/{}" },
            { name: "Medium", url: "https://medium.com/@{}" },
            { name: "VK (Vkontakte)", url: "https://vk.com/{}" },
            { name: "OK.ru", url: "https://ok.ru/{}" },
            { name: "eBay", url: "https://www.ebay.com/usr/{}" },
            { name: "Patreon", url: "https://www.patreon.com/{}" },
            { name: "SoundCloud", url: "https://soundcloud.com/{}" },
            { name: "Chess.com", url: "https://www.chess.com/member/{}" }
        ];

        function log(msg) {
            const c = document.getElementById('console');
            c.innerHTML += `<div><span style="color:var(--success)">[OK]</span> ${msg}</div>`;
            c.scrollTop = c.scrollHeight;
        }

        function startSocialScan() {
            const nick = document.getElementById('nickInput').value.trim();
            const results = document.getElementById('results');
            const consoleBox = document.getElementById('console');

            if (!nick) return;

            results.innerHTML = '';
            consoleBox.innerHTML = `[INIT] Starting emulation of Sherlock scan for: ${nick}...`;

            services.forEach((service, index) => {
                setTimeout(() => {
                    const finalUrl = service.url.replace('{}', nick);
                    
                    const card = document.createElement('div');
                    card.className = 'social-card';
                    card.innerHTML = `
                        <div>
                            <div class="social-name">${service.name}</div>
                            <span class="badge">ACTIVE LINK</span>
                        </div>
                        <a href="${finalUrl}" target="_blank" class="btn-go">VISIT</a>
                    `;
                    results.appendChild(card);
                    log(`Generated link for ${service.name}`);
                }, index * 50); // Эффект постепенной загрузки как в терминале
            });
        }
    </script>
</body>
</html>
