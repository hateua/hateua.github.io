<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-title" content="Курс валют">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&font-size=0.8&rounded=false">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=$&background=000000&color=ffffff&font-size=0.8&rounded=false">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <title>Pixel Rates</title>
    <style>
        /* ----- PIXEL ART STYLES ----- */
        :root {
            --bg: #000000;
            --main-text: #ffffff;
            --secondary: #aaaaaa;
            --dim: #555555;
            --border-style: 4px solid var(--secondary);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive; /* Fallback to standard if font fails */
            background-color: var(--bg);
            color: var(--main-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* СНЕГ */
        .snowflake {
            position: fixed;
            top: -10px;
            color: var(--main-text);
            font-size: 8px;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        /* ЭКРАН ЗАГРУЗКИ */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s; /* Плавное исчезновение */
        }
        .loading-text {
            color: var(--main-text);
            font-size: 16px;
            animation: blink 0.5s infinite;
            margin-bottom: 20px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ИНТЕРФЕЙС */
        header {
            width: 90%;
            max-width: 450px;
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        h2 { 
            margin: 0; 
            font-size: 16px; 
            text-transform: uppercase;
            color: var(--main-text);
            line-height: 1.5;
        }

        .converter-box { width: 85%; max-width: 450px; z-index: 10; }

        .input-wrapper {
            background: #000;
            border: var(--border-style);
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 6px 6px 0px var(--dim);
        }

        input {
            background: transparent;
            border: none;
            color: var(--main-text);
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            width: 55%;
            outline: none;
        }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▼'; font-size: 8px; color: var(--secondary);
            position: absolute; right: 0; top: 6px; pointer-events: none;
        }

        select {
            background: transparent; border: none; color: var(--secondary);
            font-family: 'Press Start 2P', cursive; font-size: 12px;
            outline: none; appearance: none; -webkit-appearance: none; padding-right: 20px;
        }

        .result-list { display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }

        .result-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border: 2px solid var(--secondary); background: #111;
            cursor: pointer; transition: 0.1s;
        }
        .result-item:active { transform: translate(2px, 2px); border-color: var(--main-text); }

        .currency-left { display: flex; align-items: center; }
        .flag-icon { font-size: 18px; margin-right: 15px; }
        .code { font-size: 12px; color: var(--secondary); }
        .value { font-size: 12px; color: var(--main-text); }

        .hint {
            text-align: center; font-size: 8px; color: var(--dim);
            margin-bottom: 20px; margin-top: -10px; text-transform: uppercase;
        }
        .update-time { font-size: 8px; color: var(--dim); margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loading-text">LOADING...</div>
        <div style="font-size: 8px; color: #555;">FIXING MEMORY</div>
    </div>

    <div id="snow-container"></div>

    <header>
        <h2 id="app-title">PIXEL RATES</h2>
    </header>

    <div class="converter-box">
        <div class="input-wrapper">
            <input type="number" id="amount" value="100" inputmode="decimal">
            <div class="select-wrapper">
                <select id="baseCurrency">
                    <option value="UAH">UAH</option>
                    <option value="KZT">KZT</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="PLN">PLN</option>
                    <option value="CZK">CZK</option>
                </select>
            </div>
        </div>

        <p class="hint" id="hint-text">TAP TO SWAP</p>
        <div id="results" class="result-list"></div>
        <div id="last-update" class="update-time"></div>
    </div>

    <script>
        // АВАРИЙНЫЙ ВЫХОД: Если через 4 сек загрузка висит - убираем её силой
        setTimeout(() => {
            const l = document.getElementById('loader');
            if(l && l.style.display !== 'none') {
                console.warn('Force hiding loader');
                l.style.opacity = '0';
                setTimeout(() => l.style.display = 'none', 500);
            }
        }, 4000);

        const TEXTS = {
            ru: { title: "КУРСЫ ВАЛЮТ", hint: "НАЖМИ ДЛЯ ВЫБОРА", loading: "ЗАГРУЗКА..." },
            en: { title: "PIXEL RATES", hint: "TAP TO SWAP", loading: "LOADING..." },
            ua: { title: "КУРС ВАЛЮТ", hint: "НАТИСНИ ДЛЯ ВИБОРУ", loading: "ЗАВАНТАЖЕННЯ..." },
            kz: { title: "ВАЛЮТА БАҒАМЫ", hint: "ТАҢДАУ ҮШІН БАСЫҢЫЗ", loading: "ЖҮКТЕУ..." }
        };

        const TARGETS = [
            { code: 'USD', flag: '🇺🇸' },
            { code: 'EUR', flag: '🇪🇺' },
            { code: 'KZT', flag: '🇰🇿' },
            { code: 'PLN', flag: '🇵🇱' },
            { code: 'CZK', flag: '🇨🇿' },
            { code: 'UAH', flag: '🇺🇦' }
        ];
        
        // Снег
        function createSnow() {
            const container = document.getElementById('snow-container');
            const w = window.innerWidth;
            setInterval(() => {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.innerText = '■'; 
                flake.style.left = Math.random() * w + 'px';
                flake.style.opacity = Math.random() * 0.7; 
                flake.style.fontSize = (Math.random() * 4 + 4) + 'px';
                flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(flake);
                setTimeout(() => flake.remove(), 10000);
            }, 350);
        }

        const amountInput = document.getElementById('amount');
        const baseSelect = document.getElementById('baseCurrency');
        const resultsContainer = document.getElementById('results');
        const loader = document.getElementById('loader');
        
        let ratesData = {}; 

        function autoDetect() {
            try {
                const lang = (navigator.language || navigator.userLanguage).toLowerCase();
                let currentLang = 'en';
                
                if (lang.includes('kz') || lang.includes('kk')) {
                    currentLang = 'kz';
                    baseSelect.value = 'KZT';
                } else if (lang.includes('ru')) {
                    currentLang = 'ru';
                    if (baseSelect.value !== 'KZT') baseSelect.value = 'UAH';
                } else if (lang.includes('ua') || lang.includes('uk')) {
                    currentLang = 'ua';
                    baseSelect.value = 'UAH';
                } else if (lang.includes('pl')) {
                    baseSelect.value = 'PLN';
                } else {
                    baseSelect.value = 'USD';
                }

                document.getElementById('app-title').innerText = TEXTS[currentLang].title;
                document.getElementById('hint-text').innerText = TEXTS[currentLang].hint;
                document.querySelector('.loading-text').innerText = TEXTS[currentLang].loading;
            } catch(e) { console.error('AutoDetect failed', e); }
        }

        async function fetchRates() {
            const CACHE_KEY = 'pixel_rates_v3'; // Новое имя ключа, чтобы сбросить старый глюк
            const ONE_DAY = 24 * 60 * 60 * 1000;
            let useCache = false;

            // БЕЗОПАСНОЕ чтение кэша
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && parsed.rates && (Date.now() - parsed.timestamp < ONE_DAY)) {
                        console.log('Cache OK');
                        ratesData = parsed.rates;
                        document.getElementById('last-update').innerText = 'DATA: CACHED';
                        useCache = true;
                        
                        // Быстро убираем лоадер
                        setTimeout(() => {
                            loader.style.opacity = '0';
                            setTimeout(() => loader.style.display = 'none', 500);
                            calculate();
                        }, 500);
                    }
                }
            } catch (e) {
                console.error("Cache corrupted, clearing...", e);
                localStorage.removeItem(CACHE_KEY);
            }

            if (!useCache) {
                try {
                    const response = await fetch('https://open.er-api.com/v6/latest/USD');
                    const data = await response.json();
                    
                    if (!data || !data.rates) throw new Error('API Error');

                    ratesData = data.rates;
                    
                    // Сохраняем новые чистые данные
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        timestamp: Date.now(),
                        rates: ratesData
                    }));

                    document.getElementById('last-update').innerText = 'DATA: UPDATED';
                    
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.style.display = 'none', 500);
                        calculate();
                    }, 1500);

                } catch (error) {
                    console.error(error);
                    document.querySelector('.loading-text').innerText = "ERROR / ОШИБКА";
                    // Даже если ошибка, через 3 секунды убираем экран
                    setTimeout(() => { loader.style.display = 'none'; }, 3000);
                }
            }
        }

        function calculate() {
            try {
                const amount = parseFloat(amountInput.value);
                const base = baseSelect.value;
                resultsContainer.innerHTML = '';
                
                // Защита если данные еще не прогрузились
                if (!ratesData || !ratesData[base]) {
                    if(!Object.keys(ratesData).length) return; // Ждем данных
                }

                const baseRate = ratesData[base]; 

                TARGETS.forEach(currency => {
                    if (currency.code === base) return;

                    const targetRate = ratesData[currency.code];
                    const result = (amount / baseRate) * targetRate;

                    let fraction = 2;
                    if (currency.code === 'KZT' && result > 100) fraction = 0;

                    let formatted = result.toLocaleString('ru-RU', {
                        minimumFractionDigits: fraction,
                        maximumFractionDigits: fraction
                    });

                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.onclick = function() { 
                        baseSelect.value = currency.code;
                        calculate();
                    };
                    
                    div.innerHTML = `
                        <div class="currency-left">
                            <span class="flag-icon">${currency.flag}</span>
                            <span class="code">${currency.code}</span>
                        </div>
                        <span class="value">${formatted}</span>
                    `;
                    resultsContainer.appendChild(div);
                });
            } catch(e) { console.error('Calc error', e); }
        }

        createSnow();
        autoDetect();
        fetchRates();

        amountInput.addEventListener('input', calculate);
        baseSelect.addEventListener('change', calculate);
        document.querySelector('.input-wrapper').addEventListener('click', () => amountInput.focus());

    </script>
</body>
</html>
