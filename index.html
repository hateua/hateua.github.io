<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMovie / Terminal</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #c9d1d9; --accent: #238636; --blue: #58a6ff; --yellow: #f1e05a;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
        }

        header {
            background: var(--card); border-bottom: 1px solid var(--border);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .search-box {
            display: flex; gap: 10px; flex-grow: 0.5;
        }

        input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            padding: 8px 12px; color: white; border-radius: 6px; outline: none;
        }

        .container { padding: 30px 5%; }

        h2 { border-bottom: 1px solid var(--border); padding-bottom: 10px; font-weight: 400; }

        /* Сетка фильмов */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; margin-top: 20px;
        }

        .movie-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; transition: 0.3s;
            cursor: pointer; position: relative;
        }

        .movie-card:hover { transform: translateY(-5px); border-color: var(--blue); }

        .movie-card img { width: 100%; display: block; }

        .movie-info { padding: 12px; }

        .movie-title { font-weight: 600; font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .movie-meta { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; }

        .rating { color: var(--yellow); font-weight: bold; }

        /* Модальное окно (плеер) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto;
        }

        .modal-content {
            max-width: 900px; margin: 50px auto; background: var(--card);
            border: 1px solid var(--border); border-radius: 12px; padding: 20px;
        }

        .close-btn { float: right; cursor: pointer; font-size: 24px; color: var(--text); }

        iframe { width: 100%; height: 500px; background: #000; border-radius: 8px; margin-top: 15px; }

        .details { display: flex; gap: 20px; margin-bottom: 20px; }
        .details img { width: 200px; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 20px;">GitMovie <span style="color:var(--accent)">.db</span></div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск новинок (на английском/русском)...">
        <button onclick="searchMovies()" style="background:var(--accent); border:none; color:white; padding:8px 15px; border-radius:6px; cursor:pointer;">Найти</button>
    </div>
</header>

<div class="container">
    <h2 id="sectionTitle">Последние новинки</h2>
    <div class="movie-grid" id="movieGrid">
        </div>
</div>

<div id="movieModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="movieDetails" class="details"></div>
        <div id="playerBox"></div>
        <div id="commentSection" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
            <h4>Комментарии комьюнити</h4>
            <div style="background: var(--bg); padding: 10px; border-radius: 6px; font-size: 13px; color: #8b949e;">
                Чтобы оставить комментарий, нужно быть авторизованным через GitHub.
            </div>
        </div>
    </div>
</div>

<script>
    const API_KEY = 'ВАШ_API_KEY'; // ПОЛУЧИ ЕГО НА themoviedb.org
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

    // Загрузка популярных фильмов при старте
    async function getMovies(url) {
        const res = await fetch(url);
        const data = await res.json();
        showMovies(data.results);
    }

    function showMovies(movies) {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '';

        movies.forEach(movie => {
            const { title, poster_path, vote_average, release_date, id } = movie;
            const card = document.createElement('div');
            card.classList.add('movie-card');
            card.onclick = () => openMovie(id, title, movie.overview, poster_path);

            card.innerHTML = `
                <img src="${poster_path ? IMG_PATH + poster_path : 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${title}">
                <div class="movie-info">
                    <div class="movie-title">${title}</div>
                    <div class="movie-meta">
                        <span>${release_date ? release_date.split('-')[0] : 'N/A'}</span>
                        <span class="rating">★ ${vote_average}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function searchMovies() {
        const term = document.getElementById('searchInput').value;
        if(term) {
            getMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${term}&language=ru-RU`);
            document.getElementById('sectionTitle').innerText = `Результаты поиска: ${term}`;
        }
    }

    function openMovie(id, title, overview, poster) {
        const modal = document.getElementById('movieModal');
        const details = document.getElementById('movieDetails');
        const playerBox = document.getElementById('playerBox');

        details.innerHTML = `
            <img src="${IMG_PATH + poster}">
            <div>
                <h1 style="margin-top:0">${title}</h1>
                <p style="color: #8b949e; line-height: 1.6;">${overview}</p>
                <div style="margin-top: 10px;">
                    <span style="background: var(--blue); color: black; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px;">HD 1080p</span>
                </div>
            </div>
        `;

        // Используем универсальный плеер (ищет по ID из TMDB)
        playerBox.innerHTML = `
            <iframe src="https://vidsrc.to/embed/movie/${id}" allowfullscreen></iframe>
        `;

        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('movieModal').style.display = 'none';
        document.getElementById('playerBox').innerHTML = ''; // Стоп видео при закрытии
        document.body.style.overflow = 'auto';
    }

    // Стартовая загрузка трендов
    getMovies(`https://api.themoviedb.org/3/movie/now_playing?api_key=${API_KEY}&language=ru-RU&page=1`);

</script>
</body>
</html>
