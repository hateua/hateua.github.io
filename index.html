<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BlackRates">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/39/39023.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/39/39023.png">

    <title>Black Rates</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: env(safe-area-inset-top);
            -webkit-tap-highlight-color: transparent;
        }

        /* Шапка */
        header {
            width: 90%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        h2 { 
            margin: 0; 
            font-weight: 700; 
            font-size: 24px; 
            letter-spacing: -0.5px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #333;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .converter-box { width: 90%; max-width: 400px; }

        /* Поле ввода (Сумма + Выбор) */
        .input-wrapper {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 42px;
            width: 60%;
            padding: 10px 15px;
            outline: none;
            font-weight: 300;
        }

        .select-wrapper {
            position: relative;
            background: #2c2c2e;
            border-radius: 15px;
            padding: 10px 15px;
            margin-right: 5px;
        }

        select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            padding-right: 5px;
        }

        /* Список валют */
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5px;
            border-bottom: 1px solid #1c1c1e;
        }

        .flag-icon { font-size: 24px; margin-right: 15px; }
        
        .currency-meta {
            display: flex;
            flex-direction: column;
        }
        
        .code { font-weight: 600; font-size: 18px; letter-spacing: 0.5px; }
        .name { font-size: 13px; color: #666; margin-top: 2px; }

        .value {
            font-size: 22px;
            font-weight: 500;
            color: #fff; /* Белый цвет цифр */
            font-feature-settings: "tnum"; /* Моноширинные цифры */
        }

        /* Цвет для активной валюты ввода */
        .active-input { color: #0a84ff; }
    </style>
</head>
<body>

    <header>
        <h2>Обмен Валют</h2>
        <div id="status" class="status-dot"></div>
    </header>

    <div class="converter-box">
        <div class="input-wrapper">
            <input type="number" id="amount" value="100" inputmode="decimal" placeholder="0">
            <div class="select-wrapper">
                <select id="baseCurrency">
                    <option value="UAH">UAH 🇺🇦</option>
                    <option value="USD">USD 🇺🇸</option>
                    <option value="EUR">EUR 🇪🇺</option>
                    <option value="PLN">PLN 🇵🇱</option>
                    <option value="CZK">CZK 🇨🇿</option>
                </select>
            </div>
        </div>

        <div id="results" class="result-list"></div>
    </div>

    <script>
        // Список валют
        const TARGETS = [
            { code: 'USD', name: 'Dollar', flag: '🇺🇸' },
            { code: 'EUR', name: 'Euro', flag: '🇪🇺' },
            { code: 'PLN', name: 'Zloty', flag: '🇵🇱' },
            { code: 'CZK', name: 'Koruna', flag: '🇨🇿' },
            { code: 'UAH', name: 'Hryvnia', flag: '🇺🇦' }
        ];

        const amountInput = document.getElementById('amount');
        const baseSelect = document.getElementById('baseCurrency');
        const resultsContainer = document.getElementById('results');
        const statusDot = document.getElementById('status');
        
        let ratesData = {}; 

        // Берем данные с надежного API (поддерживает UAH)
        async function fetchRates() {
            try {
                // API отдает курсы относительно USD
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                
                if (!data || !data.rates) throw new Error('API Error');

                ratesData = data.rates;
                
                // Зеленая точка - все ок
                statusDot.style.backgroundColor = '#32d74b';
                statusDot.style.boxShadow = '0 0 10px #32d74b';
                
                calculate();
            } catch (error) {
                console.error(error);
                // Красная точка - ошибка
                statusDot.style.backgroundColor = '#ff453a';
            }
        }

        function calculate() {
            const amount = parseFloat(amountInput.value);
            const base = baseSelect.value;
            
            resultsContainer.innerHTML = '';
            
            if (isNaN(amount) || !ratesData[base]) return;

            // Формула пересчета через кросс-курс (через USD)
            const baseRate = ratesData[base]; // Курс выбранной валюты к доллару

            TARGETS.forEach(currency => {
                if (currency.code === base) return; // Не показываем саму себя

                const targetRate = ratesData[currency.code];
                // Магия кросс-курса: (Сумма / КурсБазы) * КурсЦели
                const result = (amount / baseRate) * targetRate;

                // Красивое форматирование
                let formatted = result.toFixed(2);
                if (result > 1000) formatted = result.toLocaleString('ru-RU', {maximumFractionDigits: 2});

                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="flag-icon">${currency.flag}</span>
                        <div class="currency-meta">
                            <span class="code">${currency.code}</span>
                            <span class="name">${currency.name}</span>
                        </div>
                    </div>
                    <span class="value">${formatted}</span>
                `;
                resultsContainer.appendChild(div);
            });
        }

        amountInput.addEventListener('input', calculate);
        baseSelect.addEventListener('change', calculate); // Просто пересчитываем, не качаем заново

        // Старт
        fetchRates();
    </script>

</body>
</html>
