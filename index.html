<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader / GitHub</title>
    <style>
        :root {
            --color-bg: #0d1117; --color-sec-bg: #161b22; --color-border: #30363d;
            --color-text: #c9d1d9; --color-text-muted: #8b949e;
            --color-accent: #238636; --color-blue: #58a6ff; --color-error: #f85149;
        }
        body { background: var(--color-bg); color: var(--color-text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; background: var(--color-sec-bg); border-bottom: 1px solid var(--color-border); padding: 16px 0; text-align: center; margin-bottom: 40px; font-weight: 600; }
        .container { width: 90%; max-width: 600px; }
        .main-card { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 6px; padding: 24px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; background: #010409; border: 1px solid var(--color-border); border-radius: 6px; padding: 8px 12px; color: white; outline: none; }
        input:focus { border-color: var(--color-blue); }
        button { background: var(--color-accent); color: white; border: none; border-radius: 6px; padding: 8px 20px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { font-size: 13px; margin-top: 10px; color: var(--color-text-muted); text-align: center; }
        .download-link { 
            display: none; margin-top: 20px; padding: 15px; background: var(--color-sec-bg); 
            border: 1px solid var(--color-blue); border-radius: 6px; text-align: center;
        }
        .download-link a { color: var(--color-blue); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header>🚀 GitVideo Downloader</header>
    <div class="container">
        <div class="main-card">
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Вставьте ссылку на видео...">
                <button id="btn" onclick="downloadVideo()">Скачать</button>
            </div>
            <div id="status">Вставьте ссылку, чтобы начать</div>
            <div id="resultBox" class="download-link">
                <span>Файл готов!</span><br><br>
                <a id="downloadBtn" href="#" target="_blank">Кликните для сохранения</a>
            </div>
        </div>
    </div>

    <script>
        async function downloadVideo() {
            const url = document.getElementById('videoUrl').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btn');
            const resultBox = document.getElementById('resultBox');
            const dlBtn = document.getElementById('downloadBtn');

            if (!url) return alert("Введите ссылку!");

            btn.disabled = true;
            status.innerText = "⚡ Связываюсь с сервером обработки...";
            resultBox.style.display = 'none';

            try {
                // Используем один из публичных инстансов Cobalt API (бесплатный и мощный)
                const response = await fetch("https://api.cobalt.tools/api/json", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        url: url,
                        videoQuality: "720"
                    })
                });

                const data = await response.json();

                if (data.url) {
                    status.innerText = "✅ Видео найдено!";
                    dlBtn.href = data.url;
                    resultBox.style.display = 'block';
                } else {
                    status.innerText = "❌ Ошибка: Не удалось найти видео.";
                }
            } catch (err) {
                status.innerText = "❌ Ошибка сервера. Попробуйте позже.";
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
